  同一 feature 内の下の箱は "../<箱>/xxx"（帯規則の許可内）、他 feature は
  @/features/<name>（公開境界）、共有インフラは @/lib を import する。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "\\.\\./\\.\\./"
