# 境界ルール: feature 間の依存は一方向のみ。循環を作らない。
#
# 許可されている feature 間エッジ（これが全て）:
#   room → notes / dot-vote / vote-totaling / room-members / invite / hmw
#          / idea-support
#   notes → dot-vote / room-members
#
# それ以外の feature（dot-vote / vote-totaling / room-members / invite /
# room-lifecycle / auth / hmw / idea-support）は他の feature を import
# しない「葉」。
# 新しいエッジが必要になったら、循環にならないことを確認した上で
# このルールを更新する（= 依存の追加をレビュー可能な明示的変更にする）。
#
# 登録済み 10 feature は下記の per-feature / leaf 規則で守られる。未登録の
# 新 feature を fail-closed にするため、末尾に既定拒否ルール
# （unregistered-feature-must-not-import-features）を置く: 未登録 feature が
# feature import（裸の自 feature alias @/features/<self> を含む）を行うと
# 落ちる。攻撃的検証で、未登録 feature は自 feature の公開境界 index.ts を
# alias 経由で import して上帯へロンダリングできることが実証されたため。
# 新 feature を足したら、その ignores 行を追加してから per-feature 規則を書く。
id: leaf-features-must-not-import-features
language: typescript
severity: error
files:
  - features/dot-vote/**
  - features/vote-totaling/**
  - features/room-members/**
  - features/invite/**
  - features/room-lifecycle/**
  - features/auth/**
  - features/hmw/**
  - features/idea-support/**
message: この feature は他の feature に依存しない設計（葉 feature）
note: |
  共有したい部品・型は contracts / lib / 依存されている側の feature の
  公開境界（index.ts）のどれが適切かを検討する。エッジを追加する場合は
  rules/ast-grep/feature-dependencies-one-way.yml を更新し、循環がないことを示す。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "[.@]/features/"
---
id: leaf-features-must-not-import-features-tsx
language: tsx
