# 5 箱構成の判定器「JSX を返すなら箱（既定は molecules/）、返さないなら logic/」
# を機械検査にする。
# logic/ に UI が混ざると ui → logic の一方通行が崩れ、hook・reducer のテストが
# DOM 環境を要求し始める。spec は renderHook のラッパー等で JSX を使うため除外。
id: feature-logic-layer-must-not-render-jsx
language: tsx
severity: error
files:
  - features/*/logic/**
ignores:
  - "**/*.spec.tsx"
message: logic/ に JSX（UI）を置かない。コンポーネントは箱（既定は molecules/）へ
note: |
  logic/ は hook・reducer・Server Action・純関数・定数の置き場。
  JSX を返すものは箱（既定は最下帯の molecules/）に置く（spec / stories /
  fixture は実装と同居）。
rule:
  any:
    - kind: jsx_element
    - kind: jsx_self_closing_element
---
# 既定拒否（fail-closed）: 上の per-feature / leaf 規則で明示的に扱われて
# いない feature（= 未登録の新 feature）が feature を import すると落ちる。
# ignores に登録済み 8 feature を列挙し、それ以外を既定拒否にする。
# regex は連続スラッシュ（@//features・@/features//）も捕まえるよう /+ にする。
# これで「新 feature の登録漏れ」が穴ではなく CI エラーとして顕在化し、
# 裸の自 feature alias（@/features/<self> → 公開境界 → 上帯）も塞がる。
id: unregistered-feature-must-not-import-features
language: typescript
severity: error
files:
  - features/**
ignores:
  - "features/room/**"
  - "features/notes/**"
  - "features/dot-vote/**"
  - "features/vote-totaling/**"
  - "features/room-members/**"
  - "features/invite/**"
  - "features/room-lifecycle/**"
  - "features/auth/**"
  - "features/hmw/**"
  - "features/idea-support/**"
message: 未登録の feature は feature を import できない。先に feature-dependencies-one-way.yml に登録する
note: |
  新 feature の依存はまずこのファイルに明示する（葉なら leaf 規則の files に
  追加、エッジを持つなら per-feature 規則を追加）。自 feature 内は相対 import。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    regex: "[.@]/+features/+"
---
