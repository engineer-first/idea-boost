  ボード画面の配線はオーケストレーターである room 側に置き、notes は
  「付箋そのもの」に閉じる。自 feature 内は相対 import（"./xxx"）を使う。
  denylist（列挙した他 feature のみ拒否）だと将来の未登録 feature への依存が
  素通りするため、許可済み 2 feature 以外を拒否する allowlist で書く。
