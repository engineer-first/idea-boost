id: feature-band-logic-imports
language: typescript
severity: error
files:
  - features/*/logic/**
message: logic は最下帯。相対 import できるのは同ディレクトリ（./）だけ
note: |
  logic はどの箱にも依存しない（JSX 禁止と合わせて feature 内の最下層）。
  UI の部品が必要になった時点で、そのコードは logic ではなく箱側に置く。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    all:
      - regex: "^[\"']\\."
      - not:
          all:
            - regex: "^[\"']\\./"
            - not:
                regex: "\\.\\."
---
