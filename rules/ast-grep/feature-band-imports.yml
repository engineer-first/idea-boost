# 帯規則（C′「依存権の帯」）: feature 内の 5 箱
# containers → templates → organisms → molecules → logic の依存方向を強制する。
# 規則は 3 つ: 上向き import 禁止・skip 合法（templates → molecules 等）・同帯合法。
# 箱は「本質の分類」ではなく「依存権の宣言」。設計の記録は
# docs/adr/0003-feature-bands.md。
#
# 書き方はホワイトリスト型:「許可プレフィックスに一致しない相対 import を
# すべて禁止」。ブラックリスト regex では攻撃的検証で実証された抜け道
# （../index ロンダリング・.././ 等の非正規化パス・barrel 経由の
# "../organisms"・後続の遡り ../logic/../containers/）が素通りするため。
# 検知の regression テストは scripts/band-import-rules.spec.ts。
#
# 許可の形（正規形のみ。非正規化パスは解決可能でも fail-closed で弾く）:
#   - "./..."          同帯（.. を含まないこと）
#   - "../<下の箱>/..." 下向き skip（2 つ目の .. を含まないこと）
#   - alias（@/...）と bare module は相対でないので帯検査の対象外。
#     alias 経由の feature 内部への到達は no-deep-import-across-features が塞ぐ。
# 動的 import() の死角は no-dynamic-import-in-features-and-app.yml が塞ぐ。
id: feature-band-containers-imports
language: typescript
severity: error
files:
  - features/*/containers/**
message: containers から相対 import できるのは ./ と ../templates/ ../organisms/ ../molecules/ ../logic/ だけ（正規形で書く）
note: |
  公開境界（../index）や規約外のディレクトリへは届けない。
  同帯は "./xxx"、下の箱は "../<箱>/xxx" の正規形で書く。
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    field: source
    all:
      - regex: "^[\"']\\."
      - not:
          any:
            - all:
                - regex: "^[\"']\\./"
                - not:
                    regex: "\\.\\."
            - all:
                - regex: "^[\"']\\.\\./(templates|organisms|molecules|logic)/"
                - not:
                    regex: "\\.\\.[^\"']*\\.\\."
---
