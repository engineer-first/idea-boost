name: Promote Release

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: '確認済みのdevelop → release PR番号'
        required: true
        type: number

permissions:
  contents: write
  actions: write

concurrency:
  group: production-release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  promote:
    # 書込権限を渡す実行コードは既定ブランチのものだけを使う。
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - run: npm ci
      - name: Validate release note
        run: node scripts/release-automation.mts prepare "$TARGET_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
      - name: Fast-forward release and dispatch Deploy
        run: node scripts/promote-release.mts "$PR_NUMBER" "$TARGET_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TARGET_SHA: ${{ github.sha }}
