name: Chromatic

# PRのheadに対応するStorybookを公開するため、従来どおりpushで実行する。
# https://www.chromatic.com/docs/github-actions
on: push

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromaticがブランチ・コミットを識別するための履歴を取得する。
          fetch-depth: 0
          # 後続にgit push/fetchはないため、トークンをworkspaceに残さない。
          persist-credentials: false

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Publish Storybook
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # 撮影停止はプロジェクト設定のUI Tests / UI Reviewを両方OFFにする。
          # 片方でもONなら撮影が続く。公開先・閲覧権限は変更しない。
          # https://www.chromatic.com/docs/faq/disable-ui-tests-and-or-review/

          # 依存更新botのブランチでは、従来どおり公開自体をスキップする。
          skip: "@(renovate/**|dependabot/**)"

          # 公開完了で成功とする。ビルド・アップロード失敗は失敗として検知する。
          # 撮影停止用の設定ではなく、成功は画面比較の合格を意味しない。
          exitOnceUploaded: true
