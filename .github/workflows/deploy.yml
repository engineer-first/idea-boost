name: Deploy

on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # PR と同等の品質ゲート。全ジョブが通ったあと deploy へ進む。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Create .dev.vars for type generation
        run: cp workers/.dev.vars.example workers/.dev.vars

      - name: Lint & format check
        run: npm run lint -- --reporter=github

      - name: Check import boundaries (ast-grep)
        run: npm run lint:boundaries

      - name: Check feature directory layout
        run: npm run check:feature-layout

      - name: Type check
        run: npm run typecheck

      - name: Check D1 migration numbers
        run: npm run check:migrations

      - name: Check merged RoomDO migrations are immutable
        run: npm run check:room-do-migrations:immutable -- "$(git merge-base origin/develop HEAD)"

      - name: Lint database schemas (tbls)
        run: npm run db:schema:lint

      - name: Run unit tests
        run: npm run test

      - name: Run worker tests
        run: npm run test:workers

      - name: Build (OpenNext / Cloudflare)
        run: npm run build:cf
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Smoke test (service binding)
        run: npm run smoke

  deploy-api:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations (remote, idempotent)
        run: npx wrangler d1 migrations apply DB --remote --config workers/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy api-worker
        run: npm run deploy:api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-app:
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Deploy app-worker
        run: npm run deploy:app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

  health-check:
    needs: deploy-app
    runs-on: ubuntu-latest
    steps:
      - name: Check health
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL is not set." >&2
            exit 1
          fi
          for i in $(seq 1 10); do
            if curl -fsS --connect-timeout 5 --max-time 10 "$SITE_URL/api/health" | grep -q '"ok"\s*:\s*true'; then
              echo "Health check passed: $SITE_URL/api/health"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed after 10 retries" >&2
          exit 1
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
