name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 後続ステップに git push/fetch はないため、トークンを workspace に残さない
          persist-credentials: false
          # マージ済み RoomDO migration の不変性をベースとの差分で検査する。
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        with:
          install: true
          cache_max_age_days: 1

      - name: Install dependencies
        run: npm ci

      # npm ciだけでは推移依存のoptional peer不整合を検知できない。
      - name: Check dependency graph
        run: npm ls --all > /dev/null

      - name: Lint DESIGN.md
        run: npm run lint:design

      - name: Check generated design tokens
        run: npm run check:design-tokens

      - name: Create .dev.vars for type generation
        run: cp workers/.dev.vars.example workers/.dev.vars

      - name: Lint & format check
        run: npm run lint -- --reporter=github

      - name: Markdown format check (remark)
        run: |
          npm run format:md
          git diff --exit-code -- '*.md'

      # レイヤー間の依存方向（app → features → components/ui・lib → contracts）の
      # 機械検査。ルールは rules/ast-grep/。規約が壊れる速度を「レビューで気づける
      # 速度」ではなく「lint が落ちる速度」で抑える。
      - name: Check import boundaries (ast-grep)
        run: npm run lint:boundaries

      # feature 内の配置規約（フラット or 5 箱の二択・規約外ディレクトリ禁止・
      # 深さ 2 まで）。ast-grep は import 文しか見ないため、配置はここで検査する。
      - name: Check feature directory layout
        run: npm run check:feature-layout

      - name: Check ADR structure and index
        run: npm run check:adr && npx vitest run --config docs/adr/vitest.config.mts

      - name: Check shared agent skills
        run: npm run check:agent-harness

      - name: Type check
        run: npm run typecheck

      - name: Check D1 migration numbers
        run: npm run check:migrations

      # マージ済み .sql の内容変更・削除・リネームは適用済み DO と新規 DO の
      # スキーマ分岐になる（テストは常に新規 DO なので目視でしか気づけない）。
      - name: Check merged RoomDO migrations are immutable
        run: npm run check:room-do-migrations:immutable -- "${{ github.event.pull_request.base.sha || github.event.before }}"

      # マイグレーションから組み立てた実スキーマに対する構造ルールの機械検査
      # （FK インデックス貼り忘れ・テーブル肥大化など）。ルールは .tbls/*.yml。
      - name: Lint database schemas (tbls)
        run: npm run db:schema:lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 後続ステップに git push/fetch はないため、トークンを workspace に残さない
          persist-credentials: false
          # PR の変更ファイルをベースとの差分で調べる。
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        with:
          install: true
          install_args: node
          cache_max_age_days: 1

      - name: Install dependencies
        run: npm ci

      # worker 系のテストは workerd を起動するため、関係する変更がある PR と develop へのマージ後だけ回す。
      # 判定は scripts/ci-scope.mts。本番リリース前は deploy の gate でも test:workers を回す。
      - name: Decide worker test scope
        id: scope
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames "$BASE_SHA" HEAD | node scripts/ci-scope.mts
          else
            echo "workers=true" | tee -a "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Run unit tests
        run: npm run test

      - name: Run worker tests (Durable Objects / D1)
        if: steps.scope.outputs.workers == 'true'
        run: npm run test:workers

      - name: Run Preview authentication and sample worker tests
        if: steps.scope.outputs.workers == 'true'
        run: npm run test:preview

      - name: Run local verification worker tests
        if: steps.scope.outputs.workers == 'true'
        run: npm run test:verification

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Previewに表示するheadのコードをbuildし、merge treeへ読み替えない。
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # 後続ステップに git push/fetch はないため、トークンを workspace に残さない
          persist-credentials: false

      - uses: jdx/mise-action@v5
        with:
          install: true
          install_args: node
          cache_max_age_days: 1

      - name: Install dependencies
        run: npm ci

      - name: Verify PR head source before building
        if: github.event_name == 'pull_request'
        run: node scripts/preview-bundle.mts check-source
        env:
          PREVIEW_APP_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Build (OpenNext / Cloudflare)
        run: npm run build:cf
        env:
          CI: true

      # PRコードはpull_requestの隔離された権限/cache scopeでのみ実行する。
      # workflow_run側はこのrun/attemptのartifactを取得して公開するだけ。
      - name: Prepare PR Preview App and API bundle
        if: github.event_name == 'pull_request'
        run: |
          npx opennextjs-cloudflare build --config wrangler.preview.jsonc --skipNextBuild
          node scripts/preview-bundle.mts
          node scripts/preview-smoke.mts
        env:
          CI: true
          PREVIEW_APP_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: preview-app-${{ github.event.pull_request.head.sha }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 3
          path: |
            .preview-bundle/
            .open-next/assets/
            workers/migrations/
            workers/room-do-migrations/*.sql

  smoke:
    # build がビルド成功しか見ていないのに対し、ここは preview:cf 相当の
    # 環境を実際に起動し、Next.js -> サービスバインディング -> api-worker の
    # 経路が生きているかを検証する。同じチェックはローカルでも
    # `npm run smoke` で再現できる。
    # PR では build ジョブの preview-smoke が Preview bundle を workerd で起動して疎通を確かめる。
    # 本番構成のこの検査は develop へのマージ後と、リリース時の deploy gate で回す。
    # 必須チェック smoke は、ジョブが飛ばされた（skipped）場合も成功として扱われる。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          # 後続ステップに git push/fetch はないため、トークンを workspace に残さない
          persist-credentials: false

      - uses: jdx/mise-action@v5
        with:
          install: true
          install_args: node
          cache_max_age_days: 1

      - name: Install dependencies
        run: npm ci

      - name: Smoke test (service binding)
        run: npm run smoke
        env:
          CI: true
