name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 後続ステップに git push/fetch はないため、トークンを workspace に残さない
          persist-credentials: false
          # マージ済み RoomDO migration の不変性をベースとの差分で検査する。
          fetch-depth: 0

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Create .dev.vars for type generation
        run: cp workers/.dev.vars.example workers/.dev.vars

      - name: Lint & format check
        run: npm run lint -- --reporter=github

      - name: Markdown format check (remark)
        run: |
          npm run format:md
          git diff --exit-code -- '*.md'

      # レイヤー間の依存方向（app → features → components/ui・lib → contracts）の
      # 機械検査。ルールは rules/ast-grep/。規約が壊れる速度を「レビューで気づける
      # 速度」ではなく「lint が落ちる速度」で抑える。
      - name: Check import boundaries (ast-grep)
        run: npm run lint:boundaries

      # feature 内の配置規約（フラット or 5 箱の二択・規約外ディレクトリ禁止・
      # 深さ 2 まで）。ast-grep は import 文しか見ないため、配置はここで検査する。
      - name: Check feature directory layout
        run: npm run check:feature-layout

      - name: Type check
        run: npm run typecheck

      - name: Check D1 migration numbers
        run: npm run check:migrations

      # マージ済み .sql の内容変更・削除・リネームは適用済み DO と新規 DO の
      # スキーマ分岐になる（テストは常に新規 DO なので目視でしか気づけない）。
      - name: Check merged RoomDO migrations are immutable
        run: npm run check:room-do-migrations:immutable -- "${{ github.event.pull_request.base.sha }}"

      # マイグレーションから組み立てた実スキーマに対する構造ルールの機械検査
      # （FK インデックス貼り忘れ・テーブル肥大化など）。ルールは .tbls/*.yml。
      - name: Lint database schemas (tbls)
        run: npm run db:schema:lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 後続ステップに git push/fetch はないため、トークンを workspace に残さない
          persist-credentials: false

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Run worker tests (Durable Objects / D1)
        run: npm run test:workers

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start Storybook
        run: npm run storybook -- --ci --no-open > storybook-test.log 2>&1 &
      - name: Check board layout in Chromium
        run: npm run test:browser
      - name: Save screenshots and Storybook log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-layout
          path: |
            test-results/board-layout/
            storybook-test.log

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 後続ステップに git push/fetch はないため、トークンを workspace に残さない
          persist-credentials: false

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext / Cloudflare)
        run: npm run build:cf
        env:
          CI: true

  smoke:
    # build がビルド成功しか見ていないのに対し、ここは preview:cf 相当の
    # 環境を実際に起動し、Next.js -> サービスバインディング -> api-worker の
    # 経路が生きているかを検証する。同じチェックはローカルでも
    # `npm run smoke` で再現できる。
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          # 後続ステップに git push/fetch はないため、トークンを workspace に残さない
          persist-credentials: false

      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Smoke test (service binding)
        run: npm run smoke
        env:
          CI: true
