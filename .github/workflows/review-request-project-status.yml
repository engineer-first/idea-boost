name: Review Request Project Status

on:
  pull_request_target:
    types: [review_requested, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: review-request-project-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  move-direct-issue-to-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted PR base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check GitHub App configuration
        id: app-config
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.ISSUE_PROJECT_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ISSUE_PROJECT_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Review status sync skipped: configure ISSUE_PROJECT_APP_CLIENT_ID and ISSUE_PROJECT_APP_PRIVATE_KEY."
          fi

      - name: Create a narrowly scoped organization Project token
        id: project-token
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ISSUE_PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUE_PROJECT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: read
          permission-pull-requests: read
          permission-organization-projects: write

      - name: Move only the directly linked issue to Review
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.project-token.outputs.token }}
          script: |
            const { syncReviewIssueStatus } = require("./.github/scripts/sync-review-issue-status.js");
            try {
              await syncReviewIssueStatus({ github, context, core });
            } catch (error) {
              core.setFailed(error instanceof Error ? error.stack : String(error));
            }
