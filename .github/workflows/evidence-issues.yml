name: Evidence Issues

on:
  issues:
    types: [opened, edited, reopened, typed, untyped]
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: '対象Issue番号（空欄なら蓄積3 Typeを全件再確認）'
        type: string
      dry_run:
        description: '変更せず予定だけ確認する'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: evidence-issues-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number || 'reconcile' }}
  cancel-in-progress: false
  queue: max

jobs:
  route:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Create organization Project token
        uses: actions/create-github-app-token@v3
        id: project-token
        with:
          client-id: ${{ vars.ISSUE_PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUE_PROJECT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: read
          permission-organization-projects: write
      - name: Route evidence issues
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          ISSUES_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        with:
          github-token: ${{ steps.project-token.outputs.token }}
          script: |
            const { syncEvidenceIssue } = require('./.github/scripts/sync-evidence-issue.js');
            const { isEvidenceIssue } = require('./.github/scripts/evidence-issue-policy.js');
            const issuesGithub = new github.constructor({ auth: process.env.ISSUES_TOKEN, baseUrl: process.env.GITHUB_API_URL });
            const { owner, repo } = context.repo;
            const specified = process.env.ISSUE_NUMBER;
            if (specified && !/^[1-9]\d*$/.test(specified)) throw new Error('正しいIssue番号を指定してください。');
            const issues = specified
              ? [{ number: Number(specified) }]
              : (await issuesGithub.paginate(issuesGithub.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 })).filter(isEvidenceIssue);
            const rows = [];
            for (const issue of issues) {
              const result = await syncEvidenceIssue({ github, issuesGithub, owner, repo, issueNumber: issue.number, dryRun: process.env.DRY_RUN !== 'false' });
              rows.push([String(issue.number), result.reason ?? result.planned.join(', ') ?? '変更なし']);
            }
            await core.summary.addHeading('蓄積Issueの振り分け').addTable([[{data:'Issue',header:true},{data:'結果',header:true}], ...rows]).write();
