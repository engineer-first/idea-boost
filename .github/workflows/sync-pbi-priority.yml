name: Retire PBI Priority Sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pbi-priority-${{ github.repository }}
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove dedicated priority Worker and verify absence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const worker = 'idea-boost-pbi-priority';
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}`;
          async function request(path, method = 'GET', body) {
            const response = await fetch(`${base}${path}`, {
              method,
              headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' },
              ...(body === undefined ? {} : { body: JSON.stringify(body) }),
              signal: AbortSignal.timeout(30000),
            });
            const data = await response.json();
            if (!response.ok || data.success === false) throw new Error(`Cloudflare ${method} ${path}: HTTP ${response.status}`);
            return data.result ?? data;
          }
          const settings = await request('/settings');
          if (settings.bindings?.some(binding => !['secret_text', 'plain_text'].includes(binding.type))) {
            throw new Error('Unexpected stateful bindings: refusing to remove Worker');
          }
          await request('/schedules', 'PUT', []);
          const result = await request('/schedules');
          const schedules = Array.isArray(result) ? result : result.schedules;
          if (!Array.isArray(schedules) || schedules.length !== 0) throw new Error('Cron removal was not verified');
          console.log(JSON.stringify({ worker, schedules: schedules.length }));
          await request('', 'DELETE');
          const absent = await fetch(`${base}/settings`, {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
            signal: AbortSignal.timeout(30000),
          });
          await absent.body?.cancel();
          if (absent.status !== 404) throw new Error(`Worker absence was not verified: HTTP ${absent.status}`);
          console.log(JSON.stringify({ worker, removed: true, verificationStatus: absent.status }));
          NODE
