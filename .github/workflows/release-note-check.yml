name: Release Note Check

on:
  pull_request:
    branches: [release]

permissions:
  contents: read
  actions: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      # PRのコードを実行せず、既定ブランチのスクリプトで候補commitのJSONだけ読む。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - run: npm ci
      - name: Preview release note
        run: node scripts/release-automation.mts prepare "$TARGET_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
