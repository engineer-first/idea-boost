name: Issue Project Status

on:
  issues:
    types: [assigned]
  pull_request_target:
    types: [opened, review_requested, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: issue-project-status-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  sync-issue-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Check GitHub App configuration
        id: app-config
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.ISSUE_PROJECT_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ISSUE_PROJECT_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Issue status sync skipped: configure ISSUE_PROJECT_APP_CLIENT_ID and ISSUE_PROJECT_APP_PRIVATE_KEY."
          fi

      - name: Create a narrowly scoped organization Project token
        id: project-token
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ISSUE_PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUE_PROJECT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: read
          permission-pull-requests: read
          permission-organization-projects: write

      - name: Synchronize issue status and report the result
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.project-token.outputs.token }}
          script: |
            const { syncIssueProjectStatus } = require("./.github/scripts/sync-issue-project-status.js");
            try {
              const result = await syncIssueProjectStatus({ github, context, core });
              await core.summary.addHeading("Issue 状態同期")
                .addTable([
                  [{ data: "項目", header: true }, { data: "結果", header: true }],
                  ["操作", context.payload.action],
                  ["Issue", result.issueNumber ? `#${result.issueNumber}` : "対象なし"],
                  ["状態", result.updated ? `${result.from} → ${result.to}` : "変更なし"],
                  ["理由", result.reason ?? "条件を満たしたため更新"],
                ]).write();
            } catch (error) {
              core.setFailed(error instanceof Error ? error.stack : String(error));
            }
