name: Close Project Issues

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '完了・見送りからのclose予定だけを確認する'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: issue-project-status-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  close:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check GitHub App configuration
        id: app-config
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.ISSUE_PROJECT_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ISSUE_PROJECT_APP_PRIVATE_KEY }}
        run: |
          if [[ -n "$APP_CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Project close skipped: configure ISSUE_PROJECT_APP_CLIENT_ID and ISSUE_PROJECT_APP_PRIVATE_KEY."
          fi
      - name: Read the organization Project with the existing App
        id: project-token
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ISSUE_PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUE_PROJECT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-projects: read
          permission-issues: read
      - name: Close completed and not-planned issues
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ steps.project-token.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        with:
          script: |
            const { closeProjectIssues } = require('./.github/scripts/close-project-issues.js');
            // 既存clientの認証hookを共有せず、Project専用clientを作る。
            const projectGithub = new github.constructor({ auth: process.env.PROJECT_TOKEN });
            const dryRun = process.env.DRY_RUN !== 'false';
            const result = await closeProjectIssues({ projectGithub, github, ...context.repo, dryRun });
            core.info(JSON.stringify(result));
            await core.summary.addHeading(dryRun ? 'Issue close (dry-run)' : 'Issue close')
              .addTable([
                [{ data: 'Issue', header: true }, { data: 'Status', header: true }, { data: 'Close reason', header: true }],
                ...result.planned.map(change => [String(change.number), change.status, change.reason]),
              ])
              .addRaw(`Skipped after recheck: ${result.skipped.length}\n`)
              .write();
