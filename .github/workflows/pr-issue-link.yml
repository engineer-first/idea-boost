name: PR Issue Link

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-issue-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  append-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Extract issue number from branch and append to PR body
        uses: actions/github-script@v7
        with:
          script: |
            const { extractIssueNumber, buildBodyWithIssueLink } = require("./.github/scripts/append-issue-link.js");

            const branch = context.payload.pull_request.head.ref;
            const issueNumber = extractIssueNumber(branch);
            if (!issueNumber) {
              return;
            }

            // PR作成時点のpayload.bodyはstaleになりうる（作成直後にPR作成者が
            // descriptionを書き直すと上書きしてしまう）。更新直前に最新のbodyを
            // 取得し直すことで、その競合ウィンドウを最小化する。
            const { data: latestPr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const newBody = buildBodyWithIssueLink(latestPr.body, issueNumber);
            if (newBody === null) {
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: newBody,
            });
