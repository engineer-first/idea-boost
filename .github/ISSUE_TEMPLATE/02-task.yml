name: Task
description: 実装などの具体的な作業を記録する
type: Task
body:
  - type: markdown
    attributes:
      value: "[Issue記述ルール](https://github.com/engineer-first/idea-boost/blob/develop/docs/team/issue-writing.md) に沿って記入してください。思いつきの段階で起票できます。親 PBI は開発中・完了後に整理して構いません。Milestone は定期自動割当に任せ、未設定でも作業を進められます。"
  - type: textarea
    id: purpose
    attributes:
      label: Why
      description: 親PBIがあればその価値を踏まえ、この作業が必要な理由と現在の障害を書いてください。
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How
      description: 任意。既知の方針や仮説だけを短く書いてください。解決方法・具体仕様・必要な制約は担当者とAIで詰め、実装中に追記できます。未定でも起票・着手できます。
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 作業完了条件
      description: 任意。完成を判断する主要な結果を少数だけ補足してください。未定でも起票・着手できます。詳細なテストケースの列挙や全ケースの人間レビューは不要です。
      placeholder: "例: 参加者が個人ワークステップで自分の付箋を共有スペースへドラッグすると、ほかの参加者の画面にも表示される。"
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 関連Issue・補足
    validations:
      required: false
