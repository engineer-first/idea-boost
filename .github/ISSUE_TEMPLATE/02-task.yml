name: Task
description: 実装などの具体的な作業を記録する
type: Task
body:
  - type: markdown
    attributes:
      value: "思いつきの段階で起票できます。親 PBI は開発中・完了後に整理して構いません。着手時は対象 sprint の Milestone を設定してください。"
  - type: textarea
    id: purpose
    attributes:
      label: 目的・作業内容
      description: この作業で何を実現するかを書いてください。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 作業が完了したと判断できる条件を書いてください。ユーザー操作がある作業なら、どの画面で何をすると何が起きるかを1行で添えてください。名称が未確定なら仮と明記してください。
      placeholder: "例: 参加者が個人ワークステップで自分の付箋を共有スペースへドラッグすると、ほかの参加者の画面にも表示される。"
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 関連Issue・補足
    validations:
      required: false
