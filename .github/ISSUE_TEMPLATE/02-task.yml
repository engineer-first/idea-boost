name: Task
description: 実装などの具体的な作業を記録する
type: Task
body:
  - type: markdown
    attributes:
      value: "[Issue記述ルール](https://github.com/engineer-first/idea-boost/blob/develop/docs/team/issue-writing.md) に沿って記入してください。思いつきの段階で起票できます。親 PBI は開発中・完了後に整理して構いません。Milestone は定期自動割当に任せ、未設定でも作業を進められます。"
  - type: textarea
    id: purpose
    attributes:
      label: Why
      description: 親PBIがあればその価値を踏まえ、この作業が必要な理由と現在の障害を書いてください。
      placeholder: "付箋を続けて書く際、毎回追加ボタンへ移動する必要がある。入力の流れを保てるようにしたい。"
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How
      description: 解き方の検討を引き継げるよう、分かっている方針や仮説を短く書いてください。解決方法・具体仕様・制約は担当者とAIで詰め、実装中に追記できます。未定の段階から相談や作業を始められます。
      placeholder: "仮案: 既存の付箋追加処理を利用し、新しい付箋の本文へフォーカスを移す。操作方法は担当者とAIで検討する。"
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 作業完了条件
      description: 完成を判断するため、確認したい主要な結果を少数に絞って書いてください。担当者と検討しながら追記できます。細かなテストケースの生成と反復検証はAIに任せ、人は確認する観点と粒度を判断します。
      placeholder: "合意した追加操作で付箋が1枚増え、そのまま本文を書ける。"
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 関連Issue・補足
      placeholder: "親PBI: #番号（未整理なら後から紐付ける）。未確認: 日本語変換中の入力との競合。"
    validations:
      required: false
