name: PBIを作る
description: Whyとユーザーに提供する体験を短く伝える
type: PBI
body:
  - type: markdown
    attributes:
      value: "[Issue記述ルール](https://github.com/engineer-first/idea-boost/blob/develop/docs/team/issue-writing.md) に沿って記入してください。タイトルは「PBI-ジャンル-番号 主題」。既存コードは保持し、主題は何ができるかを具体的に書いてください（例: 付箋を追加し、続けて案を書ける）。ジャンル・採番は [Issue運用](https://github.com/engineer-first/idea-boost/blob/develop/docs/team/issues.md) を参照してください。"
  - type: markdown
    attributes:
      value: "Story points はPBIだけの任意項目です。判断でき、サイドバーに Story points が表示されている場合は設定できます。未設定でも起票・採用・着手を進めてください。[見積もりの目安](https://github.com/engineer-first/idea-boost/blob/develop/docs/team/issues.md#見積もりの目安)"
  - type: textarea
    id: story
    attributes:
      label: ユーザーストーリー
      description: 誰が・何をしたいか・なぜ必要かを書いてください。作成後は自動挿入された「ユーザーストーリー」の見出しを削除し、本文冒頭の段落にしてください。確認した背景と仮案を区別します。
      placeholder: "参加者として、入力を中断せず案を書き続けたい。なぜなら、思いついた内容を忘れる前に残したいからだ。"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: 現状の問題、利用者への影響、改善が必要になった背景を事実に基づいて書いてください。誰がどんな場面で困り、どう変わるとよいかを短く伝えます。解決方法は担当者とAIで詰められます。
      placeholder: "現状は付箋を追加するたびに入力先を探す必要があり、案を書く流れが止まる。"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: ユーザーに提供する体験
      description: ユーザーがどんな場面で何をできるようになるか、主要な結果を書いてください。Whyと内容を繰り返さず、体験を理解するための情報を添えます。詳細な仕様やテストケースは担当者とAIで詰めます。
      placeholder: "参加者が個人作業画面で付箋を追加すると、そのまま本文を書き始められる。"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: 関連Issue・PR、重要な対象外や未確認だけ必要に応じて添えてください。実績と今後の要望を区別します。
      placeholder: "対象外: 共有画面での追加操作。未確認: 参加者が使っているキーボードの種類。"
    validations:
      required: false
