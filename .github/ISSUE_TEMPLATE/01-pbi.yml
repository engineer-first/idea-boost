name: PBI
description: ユーザー価値と受け入れ条件を記録する
type: PBI
body:
  - type: textarea
    id: story
    attributes:
      label: ユーザーストーリー
      description: 誰が、何をしたいか、なぜ必要かを書いてください。
      placeholder: "利用者として、…したい。なぜなら、…だからだ。"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: ユーザーが確認できる条件を書いてください。操作がある場合は、誰が・どの画面で・何をすると・何が起きるかを1行で書くと、使い方が伝わります。名称が未確定なら仮と明記してください。
      placeholder: "例: 参加者が個人ワークステップで自分の付箋を共有スペースへドラッグすると、ほかの参加者の画面にも表示される。"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 補足
    validations:
      required: false
