name: PBIを作る
description: Whyとユーザーに提供する体験を短く伝える
type: PBI
body:
  - type: markdown
    attributes:
      value: "[Issue記述ルール](https://github.com/engineer-first/idea-boost/blob/develop/docs/team/issue-writing.md) に沿って記入してください。タイトルは「PBI-ジャンル-番号 主題」。既存コードは保持し、主題は何ができるかを具体的に書いてください。ジャンル・採番は [Issue運用](https://github.com/engineer-first/idea-boost/blob/develop/docs/team/issues.md) を参照してください。"
  - type: textarea
    id: why
    attributes:
      label: Why
      description: 現状の問題、利用者への影響、改善が必要になった背景を事実に基づいて書いてください。誰がどんな場面で困り、どう変わるとよいかを短く伝えます。解決方法は担当者とAIで詰められます。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 期待する振る舞い
      description: 必要な場合だけ、ユーザーに提供する体験を少数の結果で補足してください。Whyで伝われば省略できます。詳細な仕様やテストケースは不要です。
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: 関連Issue・PR、重要な対象外や未確認だけ必要に応じて添えてください。実績と今後の要望を区別します。
      placeholder: "根拠：#番号で確認した変更／仮案：確認したい背景／未確認：残る期待する振る舞い"
    validations:
      required: false
