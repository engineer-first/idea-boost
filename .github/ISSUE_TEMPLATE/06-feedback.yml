name: フィードバック
description: 日付ごとに1 Issue。本文は対象だけ、原文はコメントへ追記する
type: フィードバック
body:
  - type: markdown
    attributes:
      value: 本文は収集・調査の対象を示す入口です。まず原文・観察・成果データをコメントへ保存し、その後に必要なら要約・分析・判断を別コメントに残します。要約、現在の状況、索引の記入は要求しません。公開できる情報だけを記録してください。
  - type: textarea
    id: target
    attributes:
      label: 対象
      description: 日本時間の対象日と収集する媒体・範囲を書きます。タイトルは「YYYY-MM-DDのフィードバック」。同日の既存Issueを先に確認します。
      placeholder: 2026-10-20実施分のアプリ内フィードバックとアンケート回答。
    validations:
      required: true
