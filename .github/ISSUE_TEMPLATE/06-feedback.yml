name: フィードバック
description: アプリの受付1件・フォーム回答1件を原文とともに残す
type: フィードバック
body:
  - type: markdown
    attributes:
      value: 公開Issueです。公開可能な記録だけを残し、個人情報・招待や認証の秘密情報は載せません。アプリの閲覧権限・30日の期限とGitHubでの保存は別です。原文の転載範囲と保存期間を確認してください。本文は現在の要約、コメントは追記の履歴とします。作業用PBI・Task・Bugには関連リンクで結び、親PBIやスプリントは付けません。
  - type: textarea
    id: summary
    attributes:
      label: 要約
      description: 何の記録か、本文だけで分かるように短く書きます。
      placeholder: 投稿の要点・対象日
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 出典・識別情報
      description: 媒体、受付IDまたは元回答の行・セル、投稿日時、取得日時。ルームは共有可能な識別情報のみ。
      placeholder: 媒体、受付IDまたは元回答の行・セル、投稿日時、取得日時。ルームは共有可能な識別情報のみ。
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: 原文・受付情報
      description: 原文、選ばれた種類と対象画面・工程、任意評価。本文なし・未回答を区別し、補完しない。
      placeholder: 原文、選ばれた種類と対象画面・工程、任意評価。本文なし・未回答を区別し、補完しない。
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: 確認事項・未確認
      description: 報告された体験と再現確認を区別。複数の要望でも原投稿は分割せず、対応先を複数リンク。
      placeholder: 報告された体験と再現確認を区別。複数の要望でも原投稿は分割せず、対応先を複数リンク。
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 関連Issue・現在の判断
      description: 対応先のPBI・Task・Bug、元の一覧Issue、重要な判断コメント。未判断ならそのまま記録。
      placeholder: 関連IssueのURLと関係。採否・対応先が未定なら未判断。
    validations:
      required: false
