name: DemoGoal
description: スプリントレビューで確認する成果を記録する
type: DemoGoal
body:
  - type: textarea
    id: goal
    attributes:
      label: デモゴール
      description: 誰が・どの画面で・何をすると・何が見えるかを1行で書いてください。操作がない成果は、画面で確認できる状態を書いてください。名称が未確定なら仮と明記してください。
      placeholder: "例: 参加者が個人ワークステップで自分の付箋を共有スペースへドラッグすると、ほかの参加者の画面にも表示される。"
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: 確認観点
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: 関連PBI・補足
    validations:
      required: false
