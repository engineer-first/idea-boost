name: Bug
description: 不具合や想定外の挙動を報告する
type: Bug
body:
  - type: markdown
    attributes:
      value: "思いつきの段階で起票できます。親 PBI は開発中・完了後に整理して構いません。Milestone は定期自動割当に任せ、未設定でも作業を進められます。"
  - type: textarea
    id: observed
    attributes:
      label: 起きていること
      description: 実際に起きたことを書いてください。
      placeholder: "投票後に再接続すると、自分の投票が消えて見え、投票済みか判断できない。"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待すること
      placeholder: "再接続後も自分の投票済み状態が見える。"
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順・環境
      description: 分かる範囲で書いてください。
      placeholder: "Chromeで投票 → 通信を切る → 再接続すると投票表示が消える。別のブラウザでは未確認。"
    validations:
      required: false
