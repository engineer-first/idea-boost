name: Bug
description: 不具合や想定外の挙動を報告する
type: Bug
body:
  - type: textarea
    id: observed
    attributes:
      label: 起きていること
      description: 実際に起きたことを書いてください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待すること
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順・環境
      description: 分かる範囲で書いてください。
    validations:
      required: false
